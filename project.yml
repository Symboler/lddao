name: LingDongDota
options:
  bundleIdPrefix: com.lingdong
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  LingDongDota:
    type: application
    platform: iOS
    sources:
      - path: LingDongDota
        excludes:
          - "Info.plist"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingdong.dotaisland
        PRODUCT_NAME: LingDongDota
        INFOPLIST_FILE: LingDongDota/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
    dependencies:
      - target: DotaIslandWidget
        embed: true

  DotaIslandWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: DotaIslandWidget
        excludes:
          - "Info.plist"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingdong.dotaisland.widget
        PRODUCT_NAME: DotaIslandWidget
        INFOPLIST_FILE: DotaIslandWidget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"

schemes:
  LingDongDota:
    build:
      targets:
        LingDongDota: all
    run:
      config: Debug
    archive:
      config: Release
