<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>灵动岛 · DOTA 英雄动效预览</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif;
    background: radial-gradient(ellipse at 70% -10%, var(--glow, #8A3BE0) 0%, #06040A 55%, #020104 100%);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 40px 20px;
    overflow-x: hidden;
    transition: background 0.6s ease;
  }

  .tag {
    font-size: 11px;
    letter-spacing: 3px;
    font-weight: 700;
    color: var(--accent, #E8663A);
    margin-bottom: 8px;
  }
  h1 {
    font-size: 28px;
    font-weight: 800;
    margin-bottom: 4px;
    letter-spacing: 1px;
  }
  .subtitle {
    font-size: 12px;
    opacity: 0.45;
    margin-bottom: 36px;
    text-align: center;
    max-width: 360px;
  }

  /* 英雄切换 */
  .switcher {
    display: flex;
    gap: 10px;
    margin-bottom: 48px;
  }
  .chip {
    width: 64px;
    cursor: pointer;
    text-align: center;
    opacity: 0.55;
    transition: all 0.3s;
  }
  .chip.active { opacity: 1; transform: translateY(-2px); }
  .chip .token {
    width: 44px; height: 44px;
    border-radius: 50%;
    margin: 0 auto 6px;
    background: #111;
    border: 1px solid var(--accent, #E8663A);
    box-shadow: 0 0 10px var(--accent, #E8663A);
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .chip .token img { width: 100%; height: 100%; object-fit: cover; }
  .chip .nm { font-size: 11px; font-weight: 600; }

  /* 灵动岛容器 */
  .stage {
    perspective: 800px;
    margin-bottom: 20px;
  }
  .island {
    background: #000;
    color: #fff;
    position: relative;
    overflow: hidden;
    transition: all 0.45s cubic-bezier(0.32, 0.72, 0, 1);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.04), 0 8px 30px rgba(0,0,0,0.6);
  }
  .island.compact {
    width: 130px;
    height: 38px;
    border-radius: 22px;
    padding: 0 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .island.expanded {
    width: 380px;
    height: 168px;
    border-radius: 54px;
  }

  /* 摄像头 */
  .island::before {
    content: "";
    position: absolute;
    top: 11px;
    left: 50%;
    transform: translateX(-50%);
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #0a0a0a;
    box-shadow: inset 0 0 1px rgba(255,255,255,0.1);
    z-index: 5;
  }
  .island.compact::before { top: 15px; width: 7px; height: 7px; }

  .avatar {
    width: 24px; height: 24px;
    border-radius: 50%;
    overflow: hidden;
    border: 1px solid var(--accent, #E8663A);
    box-shadow: 0 0 6px var(--accent, #E8663A);
    flex-shrink: 0;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .souls-compact {
    font-size: 13px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: var(--accent, #E8663A);
    letter-spacing: 0.5px;
  }

  /* 展开态内容 */
  .expanded-content {
    display: none;
    width: 100%; height: 100%;
    position: relative;
    padding: 22px 18px 14px;
  }
  .island.expanded .expanded-content { display: block; }
  .island.expanded .compact-content { display: none; }

  .exp-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .exp-leading { display: flex; align-items: center; gap: 8px; }
  .exp-leading .avatar { width: 26px; height: 26px; }
  .exp-leading .names { line-height: 1.1; }
  .exp-leading .cn { font-size: 13px; font-weight: 700; }
  .exp-leading .en { font-size: 8px; font-weight: 600; opacity: 0.4; letter-spacing: 0.5px; }

  .exp-trailing { text-align: right; line-height: 1; }
  .exp-trailing .num {
    font-size: 22px;
    font-weight: 900;
    color: var(--accent, #E8663A);
    font-variant-numeric: tabular-nums;
  }
  .exp-trailing .lbl { font-size: 8px; font-weight: 700; opacity: 0.4; letter-spacing: 1.5px; margin-top: 2px; }

  /* 立绘 + 魂火 */
  .stage-art {
    position: relative;
    height: 96px;
    border-radius: 18px;
    overflow: hidden;
    margin-top: 6px;
  }
  .stage-art img {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center 20%;
    mask-image: linear-gradient(to bottom, transparent 0%, #000 38%, #000 100%);
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 38%, #000 100%);
  }
  .stage-art canvas {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
  }
  .stage-art .overlay {
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.92), rgba(0,0,0,0.1) 60%, transparent);
  }

  .skill-row {
    position: absolute;
    left: 14px; right: 14px; bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .skill-name {
    font-size: 9px;
    font-weight: 700;
    color: var(--accent, #E8663A);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .rage { flex: 1; height: 3px; background: rgba(255,255,255,0.12); border-radius: 2px; overflow: hidden; }
  .rage-fill {
    height: 100%;
    background: linear-gradient(to right, var(--accent, #E8663A), var(--glow, #8A3BE0));
    border-radius: 2px;
    transition: width 0.3s;
  }
  .rage-pct { font-size: 9px; font-weight: 800; opacity: 0.5; font-variant-numeric: tabular-nums; }

  .hint {
    margin-top: 24px;
    font-size: 11px;
    opacity: 0.4;
    text-align: center;
    max-width: 320px;
    line-height: 1.6;
  }
  .hero-info {
    margin-top: 30px;
    text-align: center;
  }
  .hero-info .big-name {
    font-size: 22px;
    font-weight: 800;
    color: var(--accent, #E8663A);
    margin-bottom: 4px;
  }
  .hero-info .skill-full {
    font-size: 11px;
    opacity: 0.5;
  }
</style>
</head>
<body>
  <div class="tag">LIVE ACTIVITY · DYNAMIC ISLAND</div>
  <h1>灵动岛 · DOTA 英雄</h1>
  <div class="subtitle">点击灵动岛切换紧凑态 / 展开态，切换英雄查看不同主题的魂火动效</div>

  <div class="switcher" id="switcher"></div>

  <div class="stage">
    <div class="island compact" id="island">
      <div class="compact-content">
        <div class="avatar"><img id="iconC" src="" alt=""></div>
        <div class="souls-compact" id="soulsC">0</div>
      </div>
      <div class="expanded-content">
        <div class="exp-top">
          <div class="exp-leading">
            <div class="avatar"><img id="iconE" src="" alt=""></div>
            <div class="names">
              <div class="cn" id="cnE">影魔</div>
              <div class="en" id="enE">SHADOW FIEND</div>
            </div>
          </div>
          <div class="exp-trailing">
            <div class="num" id="soulsE">0</div>
            <div class="lbl">SOULS</div>
          </div>
        </div>
        <div class="stage-art">
          <img id="artE" src="" alt="">
          <canvas id="flame"></canvas>
          <div class="overlay"></div>
          <div class="skill-row">
            <div class="skill-name" id="skillE">魂之挽歌 · REQUIEM OF SOULS</div>
            <div class="rage"><div class="rage-fill" id="rageFill" style="width:0%"></div></div>
            <div class="rage-pct" id="ragePct">0%</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="hero-info">
    <div class="big-name" id="bigName">影魔</div>
    <div class="skill-full" id="skillFull">魂之挽歌 · REQUIEM OF SOULS</div>
  </div>

  <div class="hint">提示：在真机上开启后回到桌面即可看到灵动岛；展开态长按可查看技能特效与充能进度。本页为 Windows 端效果预览。</div>

<script>
const HEROES = [
  { id:'nevermore', cn:'影魔', en:'Shadow Fiend', skill:'魂之挽歌 · REQUIEM OF SOULS',
    accent:'#E8663A', glow:'#8A3BE0' },
  { id:'storm_spirit', cn:'风暴之灵', en:'Storm Spirit', skill:'球状闪电 · BALL LIGHTNING',
    accent:'#4FC3F7', glow:'#1E88E5' },
  { id:'axe', cn:'斧王', en:'Axe', skill:'狂战士怒吼 · BERSERKER\'S CALL',
    accent:'#E0432A', glow:'#FF9E45' },
  { id:'invoker', cn:'祈求者', en:'Invoker', skill:'超震声波 · SUN STRIKE',
    accent:'#F2C14E', glow:'#7E57C2' }
];

let current = HEROES[0];
let souls = 0;
let rage = 0.35;
let expanded = false;

const island = document.getElementById('island');
const canvas = document.getElementById('flame');
const ctx = canvas.getContext('2d');
const rageFill = document.getElementById('rageFill');
const ragePct = document.getElementById('ragePct');

// hex -> rgba
function hexToRgba(hex, a) {
  const h = hex.replace('#','');
  const r = parseInt(h.substr(0,2),16);
  const g = parseInt(h.substr(2,2),16);
  const b = parseInt(h.substr(4,2),16);
  return `rgba(${r},${g},${b},${a})`;
}

function applyHero(h) {
  current = h;
  document.documentElement.style.setProperty('--accent', h.accent);
  document.documentElement.style.setProperty('--glow', h.glow);
  const base = 'preview-assets/hero_' + h.id;
  document.getElementById('iconC').src = base + '.png';
  document.getElementById('iconE').src = base + '.png';
  document.getElementById('artE').src = base + '_art.png';
  document.getElementById('cnE').textContent = h.cn;
  document.getElementById('enE').textContent = h.en.toUpperCase();
  document.getElementById('skillE').textContent = h.skill;
  document.getElementById('bigName').textContent = h.cn;
  document.getElementById('skillFull').textContent = h.skill;
  document.querySelectorAll('.chip').forEach((c,i)=>c.classList.toggle('active', HEROES[i].id===h.id));
}

// 构建英雄切换
const sw = document.getElementById('switcher');
HEROES.forEach((h, i) => {
  const c = document.createElement('div');
  c.className = 'chip' + (i===0?' active':'');
  c.style.setProperty('--accent', h.accent);
  c.innerHTML = `<div class="token"><img src="preview-assets/hero_${h.id}.png" alt=""></div><div class="nm">${h.cn}</div>`;
  c.onclick = () => { applyHero(h); souls = 0; rage = 0.35; };
  sw.appendChild(c);
});

// 点击切换紧凑/展开
island.addEventListener('click', () => {
  expanded = !expanded;
  island.classList.toggle('expanded', expanded);
  island.classList.toggle('compact', !expanded);
  if (expanded) { setTimeout(resizeCanvas, 50); }
});

function resizeCanvas() {
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize', () => { if(expanded) resizeCanvas(); });

// 魂火粒子绘制（复刻 Swift 版逻辑）
function drawFlame(time) {
  const rect = canvas.getBoundingClientRect();
  const w = rect.width, h = rect.height;
  if (!w || !h) return;
  ctx.clearRect(0,0,w,h);
  const accent = current.accent, glow = current.glow;
  const intensity = 1.0;

  // 底部辉光
  const g = ctx.createLinearGradient(w/2, h*0.55, w/2, h);
  g.addColorStop(0, hexToRgba(accent, 0));
  g.addColorStop(1, hexToRgba(accent, 0.30*intensity));
  ctx.fillStyle = g;
  ctx.fillRect(0, h*0.55, w, h*0.45);

  const count = 14;
  const t = time / 1000;
  for (let i=0; i<count; i++) {
    const seed = i/count;
    const speed = 0.45 + ((i*53)%29)/45;
    let progress = ((t*speed + seed) % 1 + 1) % 1;
    const sway = Math.sin(t*1.9 + i*1.3) * 0.05 * (1-progress);
    const x = w * (0.08 + 0.84*seed + sway);
    const y = h * (0.98 - 0.82*progress);
    const radius = w * (0.028 + 0.052*(1-progress)) * intensity;
    const alpha = (1-progress) * 0.9 * intensity;

    const rg = ctx.createRadialGradient(x,y,0, x,y,radius);
    rg.addColorStop(0, hexToRgba(accent, alpha));
    rg.addColorStop(0.5, hexToRgba(glow, alpha*0.7));
    rg.addColorStop(1, hexToRgba(accent, 0));
    ctx.fillStyle = rg;
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI*2);
    ctx.fill();
  }
}

let lastSoul = 0;
function loop(ts) {
  if (expanded) { drawFlame(ts); }
  // 每 700ms 增长魂能
  if (ts - lastSoul > 700) {
    lastSoul = ts;
    souls = Math.min(souls + Math.floor(Math.random()*3)+1, 99);
    rage = Math.min(rage + 0.06, 1.0);
    if (rage >= 1) rage = 0.05;
    document.getElementById('soulsC').textContent = souls;
    document.getElementById('soulsE').textContent = souls;
    rageFill.style.width = (rage*100).toFixed(0) + '%';
    ragePct.textContent = (rage*100).toFixed(0) + '%';
  }
  requestAnimationFrame(loop);
}

applyHero(HEROES[0]);
requestAnimationFrame(loop);
</script>
</body>
</html>
