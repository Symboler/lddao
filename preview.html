<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOTA PARADE · 灵动岛走秀预览</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", monospace;
    background: radial-gradient(ellipse at 50% 0%, #2A1238 0%, #06040A 55%, #010002 100%);
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 36px 20px 60px;
  }
  .tag { font-size: 10px; letter-spacing: 4px; font-weight: 800; color: #E8663A; margin-bottom: 10px; }
  h1 { font-size: 26px; font-weight: 900; letter-spacing: 2px; margin-bottom: 6px; }
  .subtitle { font-size: 12px; opacity: 0.45; margin-bottom: 28px; }

  /* 手机外框 */
  .phone {
    width: min(390px, 92vw);
    background: #0a0a0c;
    border-radius: 48px;
    padding: 14px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.8), 0 0 0 2px #222 inset;
    margin-bottom: 18px;
  }
  .screen {
    background: linear-gradient(180deg, #1a0f24 0%, #0a0610 100%);
    border-radius: 36px;
    padding: 14px 0 10px;
    min-height: 120px;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }
  /* 灵动岛 */
  .island {
    background: #000;
    border-radius: 22px;
    padding: 3px 10px;
    display: flex;
    align-items: center;
    gap: 0;
    cursor: pointer;
    transition: all 0.4s cubic-bezier(0.32, 0.72, 0, 1);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.06);
    overflow: hidden;
  }
  .island.compact { width: 134px; height: 38px; }
  .island.expanded {
    width: 100%;
    height: 128px;
    border-radius: 40px;
    flex-direction: column;
    padding: 8px;
  }
  .compact-row {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; gap: 6px;
  }
  .island.expanded .compact-row { display: none; }
  .expanded-area { display: none; width: 100%; height: 100%; flex-direction: column; }
  .island.expanded .expanded-area { display: flex; }
  .cam-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #0a0a0a; margin: 0 4px;
  }
  .lead-canvas { width: 42px; height: 32px; image-rendering: pixelated; }
  .trail-count {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #E8663A; line-height: 1;
  }
  .trail-count .n { font-size: 15px; font-weight: 900; font-variant-numeric: tabular-nums; }
  .trail-count .l { font-size: 6px; letter-spacing: 1px; opacity: 0.5; margin-top: 2px; color: #fff; }
  .parade-canvas {
    width: 100%; height: 86px; image-rendering: pixelated;
    border-radius: 14px;
  }
  .parade-caption {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 6px 0;
  }
  .parade-caption .t { font-size: 9px; font-weight: 800; letter-spacing: 1px; color: #E8663A; }
  .parade-caption .c { font-size: 9px; opacity: 0.5; }
  .hint { font-size: 11px; opacity: 0.35; margin-top: 14px; text-align: center; line-height: 1.7; max-width: 380px; }

  /* 角色选择 */
  .picker { margin-top: 28px; width: min(560px, 92vw); }
  .picker h3 { font-size: 11px; letter-spacing: 2px; opacity: 0.5; margin-bottom: 12px; font-weight: 800; }
  .char-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .char-card {
    background: rgba(255,255,255,0.04);
    border: 1.5px solid rgba(255,255,255,0.1);
    border-radius: 14px;
    padding: 10px 6px 8px;
    cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    transition: all 0.15s;
  }
  .char-card.active { border-color: var(--accent, #E8663A); background: color-mix(in srgb, var(--accent,#E8663A) 18%, transparent); }
  .char-card canvas { width: 44px; height: 44px; image-rendering: pixelated; }
  .char-card .n { font-size: 11px; font-weight: 700; }
</style>
</head>
<body>
  <div class="tag">DOTA PARADE · DYNAMIC ISLAND</div>
  <h1>灵动岛 · 英雄走秀</h1>
  <div class="subtitle">紧凑态原地踏步 · 展开态横向走秀</div>

  <div class="phone">
    <div class="screen">
      <div class="island compact" id="island">
        <div class="compact-row">
          <canvas class="lead-canvas" id="leadCanvas" width="40" height="34"></canvas>
          <div class="cam-dot"></div>
          <div class="trail-count">
            <span class="n" id="countN">4</span>
            <span class="l">HEROES</span>
          </div>
        </div>
        <div class="expanded-area">
          <canvas class="parade-canvas" id="paradeCanvas" width="200" height="80"></canvas>
          <div class="parade-caption">
            <span class="t">DOTA PARADE</span>
            <span class="c" id="capCount">4 HEROES MARCHING</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="hint" id="islandHint">点击灵动岛展开 / 收起。真机上紧凑态角色原地踏步，长按展开看完整走秀。</div>

  <div class="picker">
    <h3>选择出场角色</h3>
    <div class="char-grid" id="charGrid"></div>
  </div>

<script>
// ============ 角色数据 ============
const CHARS = {
  nevermore: { id:'nevermore', name:'影魔', en:'SHADOW FIEND', accent:'#E8663A', glow:'#8A3BE0',
    skin:'#2A1735', hair:'#E8663A', outfit:'#241030', outfitDark:'#150A1C', accent2:'#8A3BE0', eye:'#FF8A4C',
    hasHorns:true, hasMask:false, hasHat:false, weapon:'orb', hairLong:false },
  juggernaut: { id:'juggernaut', name:'剑圣', en:'JUGGERNAUT', accent:'#F2C14E', glow:'#E0432A',
    skin:'#C9A87C', hair:'#F2C14E', outfit:'#B9C0C8', outfitDark:'#6A727C', accent2:'#E0432A', eye:'#FFFFFF',
    hasHorns:false, hasMask:true, hasHat:false, weapon:'sword', hairLong:false },
  lina: { id:'lina', name:'丽娜', en:'LINA', accent:'#FF6B2B', glow:'#FFD65A',
    skin:'#F0C8A0', hair:'#E8663A', outfit:'#C23A22', outfitDark:'#8F1B12', accent2:'#FFD65A', eye:'#2A0E08',
    hasHorns:false, hasMask:false, hasHat:false, weapon:'orb', hairLong:true },
  crystal_maiden: { id:'crystal_maiden', name:'水晶室女', en:'CRYSTAL MAIDEN', accent:'#7FC8FF', glow:'#3A6FB0',
    skin:'#F0D8C8', hair:'#A8D8FF', outfit:'#5A8FC7', outfitDark:'#2E5A8C', accent2:'#C8E8FF', eye:'#1A3A5A',
    hasHorns:false, hasMask:false, hasHat:true, weapon:'staff', hairLong:true }
};
const ORDER = ['nevermore','juggernaut','lina','crystal_maiden'];

// ============ 绘制工具 ============
function px(ctx, x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
}

function drawChar(ctx, char, x, groundY, frame) {
  const isForward = frame === 0 || frame === 2;
  const bodyBob = isForward ? 1 : 0;
  const leftLegDX = frame === 0 ? -1 : (frame === 2 ? 1 : 0);
  const rightLegDX = frame === 0 ? 1 : (frame === 2 ? -1 : 0);
  const leftArmDX = frame === 0 ? 1 : (frame === 2 ? -1 : 0);
  const rightArmDX = frame === 0 ? -1 : (frame === 2 ? 1 : 0);
  const by = groundY + bodyBob;

  px(ctx, x - 5, groundY, 10, 1, 'rgba(0,0,0,0.35)');

  // legs
  px(ctx, x - 3 + leftLegDX, groundY - 4, 2, 4, char.outfitDark);
  px(ctx, x + 1 + rightLegDX, groundY - 4, 2, 4, char.outfitDark);
  px(ctx, x - 4 + leftLegDX, groundY - 1, 3, 1, '#120818');
  px(ctx, x + 1 + rightLegDX, groundY - 1, 3, 1, '#120818');

  // body
  px(ctx, x - 4, by - 9, 8, 5, char.outfit);
  px(ctx, x - 4, by - 9, 8, 1, char.outfitDark);
  px(ctx, x - 4, by - 5, 8, 1, char.outfitDark);

  // arms
  px(ctx, x - 5 + leftArmDX, by - 8, 2, 4, char.outfit);
  px(ctx, x + 3 + rightArmDX, by - 8, 2, 4, char.outfit);
  px(ctx, x - 5 + leftArmDX, by - 5, 2, 1, char.skin);
  px(ctx, x + 3 + rightArmDX, by - 5, 2, 1, char.skin);

  // head
  const hx = x - 3, hy = by - 16;
  px(ctx, hx, hy, 7, 7, char.skin);
  px(ctx, hx, hy, 7, 1, char.skin);
  // eyes
  px(ctx, hx + 1, hy + 3, 1, 1, char.eye);
  px(ctx, hx + 4, hy + 3, 1, 1, char.eye);

  // hair / headgear
  if (char.hasHorns) {
    px(ctx, hx, hy - 3, 2, 3, char.hair);
    px(ctx, hx + 5, hy - 3, 2, 3, char.hair);
  } else if (char.hasMask) {
    px(ctx, hx - 1, hy, 9, 4, char.hair);
    px(ctx, hx + 1, hy + 2, 1, 1, char.eye);
    px(ctx, hx + 5, hy + 2, 1, 1, char.eye);
  } else if (char.hasHat) {
    px(ctx, hx, hy - 3, 7, 3, char.outfit);
    px(ctx, hx - 1, hy - 1, 9, 1, char.outfitDark);
    px(ctx, hx + 2, hy - 5, 3, 2, char.accent2);
  } else {
    px(ctx, hx, hy - 1, 7, 2, char.hair);
    px(ctx, hx - 1, hy, 1, 3, char.hair);
    px(ctx, hx + 7, hy, 1, 3, char.hair);
    if (char.hairLong) {
      px(ctx, x - 5, by - 9, 1, 5, char.hair);
      px(ctx, x + 4, by - 9, 1, 5, char.hair);
    }
  }

  // weapon (right hand)
  const hx2 = x + 3 + rightArmDX, hy2 = by - 6;
  if (char.weapon === 'sword') {
    px(ctx, hx2 + 2, hy2 - 4, 1, 5, '#D8DCE0');
    px(ctx, hx2 + 1, hy2, 3, 1, char.accent2);
  } else if (char.weapon === 'axe') {
    px(ctx, hx2 + 2, hy2 - 4, 1, 5, '#6B4A2A');
    px(ctx, hx2 + 3, hy2 - 5, 3, 3, '#B9C0C8');
  } else if (char.weapon === 'staff') {
    px(ctx, hx2 + 2, hy2 - 6, 1, 7, '#6B4A2A');
    px(ctx, hx2 + 1, hy2 - 7, 3, 2, char.accent2);
    px(ctx, hx2 + 2, hy2 - 7, 1, 1, '#FFFFFF');
  } else if (char.weapon === 'orb') {
    px(ctx, hx2 + 2, hy2 - 3, 3, 3, char.accent2);
    px(ctx, hx2 + 3, hy2 - 2, 1, 1, '#FFFFFF');
  }
}

// ============ 场景渲染 ============
const WALK_FPS = 8;
const PARADE_W = 200, PARADE_H = 80, GROUND = 64, SPACING = 38, SPEED = 18;

function parade(ctx, chars, elapsed) {
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, PARADE_W, PARADE_H);
  px(ctx, 0, 0, PARADE_W, PARADE_H, '#0B0611');
  px(ctx, 0, GROUND, PARADE_W, PARADE_H - GROUND, '#14101C');
  px(ctx, 0, GROUND, PARADE_W, 1, '#3A2C48');

  if (!chars.length) return;
  const count = chars.length;
  const span = SPACING * count;
  const frame = Math.floor((elapsed * WALK_FPS) % 4);

  for (let i = 0; i < count * 2; i++) {
    const char = chars[i % count];
    let xx = ((elapsed * SPEED) + i * SPACING) % span;
    if (xx < 0) xx += span;
    xx -= 50;
    if (xx > -30 && xx < PARADE_W + 30) {
      drawChar(ctx, char, xx, GROUND, frame);
    }
  }
}

function march(ctx, chars, elapsed, limit = 2) {
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, 40, 40);
  const frame = Math.floor((elapsed * WALK_FPS) % 4);
  const shown = chars.slice(0, limit);
  const baseX = 20, cs = 18;
  const offset = -(shown.length - 1) * cs / 2;
  shown.forEach((c, i) => drawChar(ctx, c, baseX + offset + i * cs, 34, frame));
}

// ============ 应用 ============
let selected = ['nevermore','juggernaut','lina','crystal_maiden'];
let startTs = performance.now();

function getChars() { return selected.map(id => CHARS[id]).filter(Boolean); }

const leadCanvas = document.getElementById('leadCanvas');
const paradeCanvas = document.getElementById('paradeCanvas');
const countN = document.getElementById('countN');
const capCount = document.getElementById('capCount');
const leadCtx = leadCanvas.getContext('2d');
const paradeCtx = paradeCanvas.getContext('2d');

function loop(now) {
  const elapsed = (now - startTs) / 1000;
  const chars = getChars();
  march(leadCtx, chars, elapsed, 2);
  parade(paradeCtx, chars, elapsed);
  countN.textContent = chars.length;
  capCount.textContent = `${chars.length} HEROES MARCHING`;
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// 灵动岛展开
const island = document.getElementById('island');
island.addEventListener('click', () => {
  const expanded = island.classList.toggle('expanded');
  island.classList.toggle('compact', !expanded);
});

// 角色选择卡片
const grid = document.getElementById('charGrid');
ORDER.forEach(id => {
  const char = CHARS[id];
  const card = document.createElement('div');
  card.className = 'char-card active';
  card.style.setProperty('--accent', char.accent);
  card.innerHTML = `<canvas width="40" height="40"></canvas><div class="n"></div>`;
  card.querySelector('.n').textContent = char.name;
  const c = card.querySelector('canvas').getContext('2d');
  drawChar(c, char, 20, 34, 0);
  card.addEventListener('click', () => {
    const idx = selected.indexOf(id);
    if (idx >= 0) selected.splice(idx, 1);
    else selected.push(id);
    card.classList.toggle('active', selected.includes(id));
    startTs = performance.now();
  });
  grid.appendChild(card);
});
</script>
</body>
</html>
