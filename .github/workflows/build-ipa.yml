name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Xcode version
        run: xcodebuild -version

      - name: List schemes
        run: xcodebuild -list -project LingDongDota.xcodeproj

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project LingDongDota.xcodeproj \
            -scheme LingDongDota \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -archivePath "$RUNNER_TEMP/LingDongDota.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            archive 2>&1 | tee build.log

      - name: Publish failure log to ci-logs branch
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f build.log ] || echo "build.log not found" > build.log
          git checkout --orphan ci-logs-tmp
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add -f build.log
          git commit -m "ci: build log for ${GITHUB_SHA}" || true
          git push -f origin HEAD:ci-logs

      - name: Annotate key errors
        if: failure()
        run: |
          if [ -f build.log ]; then
            grep -nE "(error:|failing|Undefined symbol|The following build commands failed)" build.log | head -n 40 | while IFS= read -r line; do
              echo "::error::$(printf '%s' "$line" | cut -c1-1000)"
            done
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 30

      - name: Publish failure log as commit comment
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = 'build.log not found';
            try { log = fs.readFileSync('build.log', 'utf8'); } catch (e) {}
            const tail = log.length > 60000 ? log.slice(-60000) : log;
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: '### 构建失败日志\n```\n' + tail + '\n```'
            });

      - name: Package unsigned IPA
        run: |
          APP="$RUNNER_TEMP/LingDongDota.xcarchive/Products/Applications/LingDongDota.app"
          mkdir -p Payload
          cp -R "$APP" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload LingDongDota-unsigned.ipa
          rm -rf Payload
          ls -lh LingDongDota-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LingDongDota-unsigned-ipa
          path: LingDongDota-unsigned.ipa
          retention-days: 30
