name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Xcode version
        run: xcodebuild -version

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project LingDongDota.xcodeproj \
            -scheme LingDongDota \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/LingDongDota.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            archive

      - name: Package unsigned IPA
        run: |
          APP="$RUNNER_TEMP/LingDongDota.xcarchive/Products/Applications/LingDongDota.app"
          mkdir -p Payload
          cp -R "$APP" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload LingDongDota-unsigned.ipa
          rm -rf Payload
          ls -lh LingDongDota-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LingDongDota-unsigned-ipa
          path: LingDongDota-unsigned.ipa
          retention-days: 30
